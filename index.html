<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27407a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="四季報">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>四季報ビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 紙面の版面を思わせる罫線主体のレイアウト。実績＝藍、予想＝紫で全画面統一 */
:root{
  --paper:#f6f6f2; --surface:#ffffff; --ink:#1d2230; --muted:#666c7a; --rule:#d9dadf;
  --accent:#27407a; --fc:#7a4fb0; --fc-soft:#e6dcf3; --act-soft:#d8e0f0;
  --up:#1e7a4a; --down:#b23a3a; --buy-soft:#dcefe3; --sell-soft:#f6dede;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161c; --surface:#1c1f27; --ink:#e7e8ec; --muted:#9a9fac; --rule:#30343f;
  --accent:#8fa8e6; --fc:#b994e6; --fc-soft:#3a2f4d; --act-soft:#2a3550; --up:#5cc58d; --down:#f08080; --buy-soft:#1f3a2b; --sell-soft:#43262a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#14161c; --surface:#1c1f27; --ink:#e7e8ec; --muted:#9a9fac; --rule:#30343f;
  --accent:#8fa8e6; --fc:#b994e6; --fc-soft:#3a2f4d; --act-soft:#2a3550; --up:#5cc58d; --down:#f08080; --buy-soft:#1f3a2b; --sell-soft:#43262a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.num,table{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header.top{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-top:12px;padding-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.searchrow{min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.searchrow{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
#sort{flex:0 0 auto;width:9.5em;min-width:0;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.meta{color:var(--muted);font-size:12px;margin:10px 0 6px}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.recent a{font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ul.list li a{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
ul.list li a:hover{background:var(--surface)}
.code{font-weight:700;color:var(--accent);overflow-wrap:anywhere}
ul.list.wide li a{grid-template-columns:78px 1fr auto}
.wrow.wide{grid-template-columns:78px 1fr auto}
.nm{font-weight:700;overflow-wrap:anywhere}
.px{text-align:right;font-weight:700}
.sub{grid-column:2 / 4;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.sub b{color:var(--ink);font-weight:400}
.more{display:block;width:100%;margin:14px 0;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer}
.back{display:inline-block;margin:12px 0 4px;color:var(--accent);text-decoration:none;font-size:14px}
.dh{display:grid;gap:4px;padding:6px 0 12px;border-bottom:2px solid var(--ink)}
.dh .c{color:var(--accent);font-weight:700}
.dh h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.dh .p{font-size:14px;color:var(--muted)}
.dh .p b{font-size:20px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--rule)}
.tile{padding:10px 8px;border-right:1px solid var(--rule)}
.tile:last-child{border-right:0}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:18px;font-weight:700}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
section{margin-top:22px}
section h3{font-family:var(--display);font-size:17px;margin:0 0 8px;padding-left:8px;border-left:4px solid var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.charts{gap:8px}.chart{padding:6px 4px 2px}}
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 8px 4px}
.chart .t{font-size:12.5px;font-weight:700;margin-bottom:2px}
.chart svg{display:block;width:100%;height:auto}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font-weight:700;color:var(--muted);font-size:12px}
tr.fc td{color:var(--fc)}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.a{background:var(--act-soft);color:var(--accent)}
.tag.f{background:var(--fc-soft);color:var(--fc)}
.neg{color:var(--down)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:13.5px}
.kv div:nth-child(odd){border-right:1px solid var(--rule)}
.kv span{color:var(--muted)}
@media (max-width:480px){.kv{grid-template-columns:1fr}.kv div:nth-child(odd){border-right:0}}
.small{font-size:12px;color:var(--muted)}
.cm{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:10px;max-width:65em}
.cm p{margin:0}
.cm .h{font-weight:700}
.cm .h::before{content:"【";color:var(--muted)}.cm .h::after{content:"】";color:var(--muted)}
.note{border-left:3px solid var(--fc);padding:4px 10px;font-size:13px;color:var(--muted);background:var(--surface)}
.empty{padding:28px 0;color:var(--muted)}
.loading{padding:40px 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tabs a{white-space:nowrap;padding:6px 12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
@media (max-width:420px){.tabs{gap:0}.tabs a{padding:6px 7px;font-size:13px}}
#wcount{margin-left:6px;font-size:11px;color:var(--surface);background:var(--accent);border-radius:999px;padding:0 6px}
#wcount:empty{display:none}
#hcount{margin-left:6px;font-size:11px;color:var(--surface);background:var(--accent);border-radius:999px;padding:0 6px}
#hcount:empty{display:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.buy{background:var(--buy-soft);color:var(--up)}
.pill.sell{background:var(--sell-soft);color:var(--down)}
.pill.hold{background:var(--rule);color:var(--muted)}
.wsum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 8px}
.wsum .grow{flex:1}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--down);border-color:var(--down)}
.btn:disabled{opacity:.5;cursor:default}
.wrow{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.wrow .sub{grid-column:2 / 4}
.bar{position:relative;height:6px;background:var(--rule);border-radius:3px;margin-top:4px;grid-column:2 / 4}
.bar i{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}
.bar b{position:absolute;top:0;height:6px;border-radius:3px}
.theo{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.theo .big{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.theo .big div{display:grid}
.theo .big span{font-size:11.5px;color:var(--muted)}
.theo .big b{font-size:22px}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px}.vrow:last-child{border-bottom:0}
.model-guide{display:grid;gap:12px}
.model-card{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px}
.model-card h4{margin:0 0 6px;font-size:17px}
.model-card p{margin:4px 0;line-height:1.65}
.model-card .fit{font-weight:700}
.model-card .weak{color:var(--muted)}
.model-used{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.model-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:520px){.model-map{grid-template-columns:1fr}.model-card{padding:12px}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form input{min-width:0;width:100%}
.form input{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15px;color:var(--ink)}
.form .wide{grid-column:1 / -1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill.warn{background:#f9eeda;color:#8a5a00}
.hsum{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:8px;margin:12px 0 4px}
.hsum div{padding:8px 10px;border-right:1px solid var(--rule)}
.hsum div:last-child{border-right:0}
.hsum span{display:block;font-size:11.5px;color:var(--muted)}
.hsum b{font-size:17px}
@media (max-width:480px){.hsum{grid-template-columns:repeat(2,1fr)}.hsum div:nth-child(2){border-right:0}.hsum div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.story{display:grid;gap:12px;font-size:14px;line-height:1.6}
.drv{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:8px 10px}
.drv summary{cursor:pointer;font-weight:700;font-size:15px}
.drv-seg{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:3px}
.drv-row{padding:7px 0;border-bottom:1px solid var(--rule)}
.drv-row:last-child{border-bottom:0}
.drv-k{font-size:13.5px}
.drv-v{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.drv-none{color:var(--muted);font-weight:400}
.drv-up,.drv-down,.drv-flat{border-left:4px solid var(--rule);padding-left:8px}
.drv-up{border-left-color:var(--up)}.drv-up .drv-v{color:var(--up)}
.drv-down{border-left-color:var(--down)}.drv-down .drv-v{color:var(--down)}
.pill.drv-p-up{background:var(--buy-soft);color:var(--up)}
.pill.drv-p-down{background:var(--sell-soft,#f7dede);color:var(--down)}
.pill.drv-p-flat{background:var(--rule);color:var(--muted)}
.story-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.story-head h3{margin:0;font-size:17px}
.story-thesis{margin:0;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;font-weight:700}
.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.story-card{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--surface)}
.story-card .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.story-card .v{font-size:13.5px;line-height:1.6}
.story-card.keep{border-left:4px solid var(--up)}
.story-card.warn{border-left:4px solid #b07a19}
.story-card.break{border-left:4px solid var(--down)}
.story-card.kpi{border-left:4px solid var(--accent)}
.story-price{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.story-price .story-card .v{font-size:18px;font-weight:700}
.kpi-progress{display:grid;gap:8px}
.kpi-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi-progress-head b{font-size:16px}
.kpi-score{font-size:22px;font-weight:800;color:var(--accent)}
.kpi-row{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--surface)}
.kpi-row-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.kpi-row .name{font-weight:700}
.kpi-row .src{font-size:11px;color:var(--muted)}
.kpi-row .nums{font-size:13px;margin-top:4px}
.kpi-row .pct{font-size:18px;font-weight:800}
.kpi-track{height:7px;border-radius:999px;background:var(--rule);overflow:hidden;margin-top:7px}
.kpi-track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kpi-row.ok .kpi-track i{background:var(--up)}
.kpi-row.warn .kpi-track i{background:#b07a19}
.kpi-row.bad .kpi-track i{background:var(--down)}
.story h3{margin:6px 0 0;font-size:15px}
.story-actions{border-top:1px solid var(--rule);padding-top:10px}
@media (max-width:520px){.story-grid,.story-price{grid-template-columns:1fr}.story-thesis{font-size:13.5px}.story-card{padding:10px}}
.jl{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.jl li{padding:8px 2px;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.55}
.jl .d{color:var(--muted);font-size:12px;margin-right:6px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--fc-soft)}
.msg.err{background:var(--sell-soft);color:var(--down)}
details.f summary{cursor:pointer;color:var(--accent);font-size:13px}
details.f div{font-size:12.5px;color:var(--muted);padding-top:6px;display:grid;gap:3px}
/* 押した感：押している間は少し縮んで色が濃くなる。押したあと一瞬光る */
html{-webkit-tap-highlight-color:transparent}
.btn,.chip,.more,.tabs a,.wrow,ul.list li a,.back,.recent a{transition:transform .08s ease,background-color .12s ease,filter .12s ease,box-shadow .2s ease}
.btn:active:not(:disabled),.chip:active,.more:active{transform:scale(.95);filter:brightness(.88)}
.tabs a:active{background:var(--rule)}
.wrow:active,ul.list li a:active,.recent a:active,.back:active{background:var(--rule)}
.tapped{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (prefers-reduced-motion:reduce){.btn,.chip,.more,.tabs a,.wrow,ul.list li a{transition:none}.btn:active:not(:disabled),.chip:active,.more:active{transform:none}}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>四季報ビューア</h1><span id="brand-sub">日本株データ</span></div>
  <nav class="tabs" aria-label="画面切り替え"><a href="#hold" id="t-hold">保有銘柄<span id="hcount" class="cnt"></span></a><a href="#watch" id="t-watch">監視銘柄<span id="wcount"></span></a><a href="#models" id="t-models">モデル解説</a><a href="#settings" id="t-settings" style="margin-left:auto">設定</a></nav>
  <div class="searchrow">
    <select id="mk" aria-label="市場"><option value="jp">日本株</option><option value="us">米国株</option><option value="hk">中国株（香港）</option></select>
    <input id="q" type="search" placeholder="コード・ティッカー・銘柄名で検索" autocomplete="off" aria-label="銘柄を検索">
  </div>
</div></header>
<main class="wrap" id="app"><div class="loading">データを読み込んでいます…</div></main>
<script>
(function(){
const app=document.getElementById('app'), qEl=document.getElementById('q');
let D=null, H=null, IDX={}, BY={}, shown=100;
const flt={up:false,yld:false,num:false,g17:false,sat:false};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
window.addEventListener('error',e=>{console.error(e.error||e.message);if(app&&/データを読み込んでいます/.test(app.textContent||''))app.innerHTML='<div class="msg err">画面の初期化でエラーが起きました。再読み込みしてください。</div><div class="actions"><a class="btn ghost" href="#models">モデル解説</a><a class="btn" href="#settings">設定</a></div>'});
// 市場：日本株（J-Quants・毎日）／米国株 S&P500・中国株 香港（Yahoo Finance・毎月）。データは市場ごとに端末へ保存
const DS={}; const MKN={jp:'日本株',us:'米国株',hk:'中国株（香港）'}; const IDB={jp:'data',us:'data-us',hk:'data-hk'};
let MK=(()=>{const m=store.get('shk-mk','jp');return MKN[m]?m:'jp'})();
const mkEl=document.getElementById('mk'); mkEl.value=MK;
let SHYM={};

function isNum(x){return typeof x==='number'&&isFinite(x)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fm(x,dec=0){ if(!isNum(x)) return x==null?'—':esc(x);
  const s=Math.abs(x).toLocaleString('ja-JP',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return x<0?'<span class="neg">△'+s+'</span>':s; }
function pc(x,dec=1){ if(!isNum(x)) return x==null?'—':esc(x);
  const s=Math.abs(x*100).toFixed(dec)+'%'; return x<0?'<span class="neg">△'+s+'</span>':s; }
function col(k,name){return (IDX[k]||{})[name]}
// 通貨の表示：日本株は円、米国株・中国株は株価の通貨（USD・HKD）。金額（百万）は財務の通貨
function kindOf(c){c=String(c||'').toUpperCase();return /\.HK$/.test(c)?'hk':/^[0-9][0-9A-Z]{3}$/.test(c)?'jp':'us'}
function mkOf(s){return (s&&s._m)||'jp'}
function cu(s){return mkOf(s)==='jp'?'円':' '+((s&&s._pc)||'')}
function pd(s){return mkOf(s)==='jp'?0:2}
function fu(s){return mkOf(s)==='jp'?'百万円':'百万'+((s&&s._fc)||'')}
function cuC(c){const s=BY[c]; if(s) return cu(s); const k=kindOf(c); return k==='jp'?'円':k==='us'?' USD':' HKD'}
function pdC(c){return kindOf(c)==='jp'?0:2}

function yen(s,v){ if(!isNum(v)) return null; if(mkOf(s)==='jp') return v; const d=DS[mkOf(s)]; const f=d&&d.fx&&d.fx[s._pc]; return isNum(f)?v*f:null; }

function prep(){
  IDX={}; BY={};
  for(const m in DS){ const h=DS[m].h; for(const k in h){ IDX[k]=IDX[k]||{}; h[k].forEach((n,i)=>{ if(IDX[k][n]===undefined) IDX[k][n]=i; }); } }
  for(const m in DS) prepOne(DS[m],m);
  D=DS[MK]||null; H=D&&D.h; OLD_GAS=!!(DS.jp&&DS.jp.g17===undefined);
  brand();
}
function brand(t){ const b=document.getElementById('brand-sub'); if(b) b.textContent=t||(D?(MK==='jp'?'日本株データ・':MKN[MK]+'・Yahoo Finance・')+D.s.length.toLocaleString()+'銘柄':MKN[MK]);
  document.querySelectorAll('.jp-only').forEach(el=>{el.style.display=MK==='jp'?'':'none'}); }
function prepOne(d,m){
  for(const s of d.s){ BY[s.code]=s; s._m=m; s._in=undefined;
    const L=s.l||[]; const g=n=>L[col('list',n)];
    s._per=g('今期予想PER（倍）'); s._pbr=g('PBR（倍）'); s._yld=g('配当利回り上限'); s._opg=g('予想営業増益率対直近実績');
    s._rvg=g('予想増収率対直近実績'); s._opm=g('今期予想営業利益率'); s._px=g('株価（円）');
    // 株主還元利回り（配当＋自社株買い）。列が無いときは配当利回りだけで代用
    const sy=g('株主還元利回り（配当＋自社株買い）'); s._shy=isNum(sy)?sy:(isNum(s._yld)?s._yld:null); s._shySrc=isNum(sy)?'':'配当のみ';
    s._key=(s.code+' '+(s.name||'')).toLowerCase().normalize('NFKC');
    s._has=isNum(s._px);
    if(m!=='jp'&&!isNum(s._opg)) s._opg=g('予想EPS成長率対直近実績');
    s._pc=g('株価通貨')||(m==='jp'?'円':''); s._fc=g('財務通貨')||s._pc;
  }
  const G=d.g17||{}, SAT=(d.sat&&d.sat.rows)||[];
  for(const s of d.s){ s._g17=m==='jp'?(G[s.code]||''):''; s._sat=null; }
  if(m==='jp') for(const o of SAT){ if(BY[o.code]&&BY[o.code]._m==='jp') BY[o.code]._sat=o; }
  try{fitC2(d.s)}catch(e){console.error('fitC2 error',m,e)}
  if(m!=='jp') evopForeign(d);
  // 黒字続きの銘柄の中での還元利回りの中央値（検証のK2：割安上位のうち還元利回りが中央値以上）
  const ys=d.s.map(x=>{const i=inputs(x);return i&&i.good&&isNum(x._shy)?x._shy:null}).filter(isNum).sort((a,b)=>a-b);
  SHYM[m]=ys.length?ys[Math.floor(ys.length/2)]:null;
  for(const x of d.s){const t=safeTheo(x); x._pick=!!(t&&t.pick);}
}

// 営業利益/EV（米国株・中国株）：日本株と同じ式。EV＝時価総額＋有利子負債−現金等、営業利益は直近の通期実績。
// 金融（セクター Financial Services）を除く・時価総額100億円以上（円換算）。FCF（当期と前期の2年平均）がマイナスは除く。上位100に順位
function evopForeign(d){
  const rows=[];
  for(const s of d.s){
    const L=s.l||[], F=(s.f||[])[0]||[]; const g=n=>L[col('list',n)], gf=n=>F[col('fin',n)];
    if(/Financial/i.test(String(g('セクター')||''))) continue;
    const mc=g('時価総額（百万・株価通貨）'), rate=isNum(g('換算レート株価→財務通貨'))?g('換算レート株価→財務通貨'):1;
    if(!isNum(mc)||!(yen(s,mc*1e6)>=1e10)) continue;
    const act=(s.y||[]).filter(r=>r[col('years','区分')]==='実績'&&isNum(r[col('years','営業利益（百万円）')]));
    if(!act.length) continue;
    const op=act[act.length-1][col('years','営業利益（百万円）')];
    const ibd=isNum(gf('有利子負債'))?gf('有利子負債'):0, cash=isNum(gf('現金等'))?gf('現金等'):0, eq=gf('自己資本');
    const ev=mc*rate+ibd-cash, ic=isNum(eq)?eq+ibd-cash:null;
    const fc=[gf('フリーCF 当期'),gf('フリーCF 前期')].filter(isNum);
    if(!(ev>0)||!(op>0)) continue;
    rows.push({s,evop:op/ev,roic:isNum(ic)&&ic>0?op*0.7/ic:null,fcf:fc.length>=2?fc.reduce((a,b)=>a+b,0)/fc.length/ev:null,ev,op});
  }
  const el=rows.filter(r=>!(isNum(r.fcf)&&r.fcf<0)).sort((a,b)=>b.evop-a.evop);   // 2026-11-09：ROIC下位2割の除外はやめた（再検証で効果なし）
  el.forEach((r,i)=>{ if(i<100) r.s._sat={rank:i+1,evop:r.evop,roic:r.roic,fcf:r.fcf,ev:r.ev,op:r.op,fields:''}; });
  d.sat={note:'営業利益/EVの順位（参考）：金融除く・時価総額100億円以上（円換算）を、営業利益/EVの大きい順に。FCF（当期と前期の平均）マイナスは除く（ROICは参考表示）。対象 '+el.length+' 社。',rows:[]};
}
function satKey(s){const o=s._sat;if(!o)return 1e9;return isNum(o.rank)?o.rank:9999}
function satPill(s){const o=s&&s._sat;if(!o)return '';return '<span class="pill hold">営業利益/EV '+(isNum(o.rank)?o.rank+'位':'')+'</span>'}
function filtered(){
  const q=qEl.value.trim().toLowerCase().normalize('NFKC');
  let a=D.s.filter(s=>(!q||s._key.includes(q))&&(!flt.num||s._has)&&(!flt.yld||(isNum(s._yld)&&s._yld>=0.03))&&(!flt.up||(isNum(s._opg)&&s._opg>0&&isNum(s._rvg)&&s._rvg>0))&&(!flt.g17||s._g17)&&(!flt.sat||s._sat));
  const k=sortEl.value, asc=(f)=>(x,y)=>{const a=x[f],b=y[f];const na=!isNum(a)||(f==='_per'&&a<=0),nb=!isNum(b)||(f==='_per'&&b<=0);if(na&&nb)return 0;if(na)return 1;if(nb)return -1;return a-b};
  const desc=(f)=>(x,y)=>{const a=x[f],b=y[f];if(!isNum(a)&&!isNum(b))return 0;if(!isNum(a))return 1;if(!isNum(b))return -1;return b-a};
  if(k==='per')a.sort(asc('_per')); else if(k==='pbr')a.sort(asc('_pbr')); else if(k==='yld')a.sort(desc('_yld')); else if(k==='opg')a.sort(desc('_opg')); else if(k==='opm')a.sort(desc('_opm')); else if(k==='shy')a.sort(desc('_shy')); else if(k==='sat')a.sort((x,y)=>satKey(x)-satKey(y)); else if(k==='pick')a.sort((x,y)=>(y._pick-x._pick)||((isNum(y._shy)?y._shy:-1)-(isNum(x._shy)?x._shy:-1)));
  return a;
}

function barChart(title,rows,vi,unit){
  const pts=rows.map(r=>({l:String(r[col('years','決算期')]||'').replace(/^20/,''),v:r[vi],f:/予想/.test(r[col('years','区分')]||'')})).filter(p=>p.l);
  const vals=pts.map(p=>p.v).filter(isNum); if(!vals.length) return '';
  const W=320,Hh=150,pl=4,pr=4,pt=16,pb=22; const mx=Math.max(0,...vals), mn=Math.min(0,...vals); const rng=(mx-mn)||1;
  const y=v=>pt+(mx-v)/rng*(Hh-pt-pb); const bw=(W-pl-pr)/pts.length;
  let s='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(title)+'の推移">';
  s+='<line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--rule)"/>';
  pts.forEach((p,i)=>{const x=pl+i*bw+bw*0.18,w=bw*0.64; const fill=p.f?'var(--fc)':'var(--accent)';
    if(isNum(p.v)){const y0=y(Math.max(0,p.v)),h=Math.max(1,Math.abs(y(p.v)-y(0)));
      s+='<rect x="'+x+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="2" fill="'+fill+'" opacity="'+(p.f?0.55:0.9)+'"/>';
    }
    s+='<text x="'+(x+w/2)+'" y="'+(Hh-6)+'" text-anchor="middle" font-size="9.5" fill="'+(p.f?'var(--fc)':'var(--muted)')+'">'+esc(p.l)+'</text>';
  });
  s+='<text x="'+pl+'" y="11" font-size="10" fill="var(--muted)">最大 '+Math.round(mx).toLocaleString()+(mn<0?'　最小 △'+Math.round(-mn).toLocaleString():'')+'</text>';
  s+='</svg>';
  return '<div class="chart"><div class="t">'+esc(title)+'<span class="small">（'+esc(unit||'百万円')+'）</span></div>'+s+'</div>';
}

// ===== 理論株価（2026-11 検証の採用案） =====
// 本体：残余利益モデル。BPS＋（ROE−資本コスト）×BPS を、ROEが10年かけて資本コストへ戻る前提で割引合計。

let SEC=null, SHY_MED=null;
const clip=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));

// 保有8銘柄は銘柄ごとに主モデルを1つ採用し、その他は参考値として表示する。
const MODEL_CONFIG={
  '8306':{primary:'残余利益',refs:['妥当PBR','総還元','業種PER']},
  '8316':{primary:'残余利益',refs:['妥当PBR','総還元','業種PER']},
  '8058':{primary:'SOTP',refs:['残余利益','DCF','EVA','総還元','簡易FCFE','業種EV/EBITDA','業種PER','業種PBR']},
  '6432':{primary:'DCF',refs:['簡易FCFE','業種EV/EBITDA','EVA','総還元','業種PER']},
  '8088':{primary:'EVA',refs:['簡易FCFE','業種EV/EBITDA','DCF','総還元','業種PER','業種PBR']},
  '7203':{primary:'業種PER',refs:['EVA','業種EV/EBITDA','簡易FCFE','DCF','総還元']},
  '8473':{primary:'残余利益',refs:['妥当PBR','総還元','業種PER']},
  '4755':{primary:'SOTP',refs:['DCF','EVA','総還元','簡易FCFE','業種EV/EBITDA','業種PER','業種PBR','残余利益']}
};
function median(a){const x=a.filter(isNum).sort((p,q)=>p-q);if(!x.length)return null;const n=x.length;return n%2?x[(n-1)/2]:(x[n/2-1]+x[n/2])/2}
function secOf(s){return SEC&&SEC.c[s.code]!=null?SEC.c[s.code]:null}
function actualOp(s){const Y=n=>col('years',n),a=(s.y||[]).filter(r=>r[Y('区分')]==='実績'&&isNum(r[Y('営業利益（百万円）')]));return a.length?a[a.length-1][Y('営業利益（百万円）')]:null}
function salesGrowth(s){const Y=n=>col('years',n),a=(s.y||[]).filter(r=>r[Y('区分')]==='実績'&&isNum(r[Y('売上高（百万円）')])).map(r=>r[Y('売上高（百万円）')]);if(a.length<2||!(a[0]>0))return 0;const n=Math.min(5,a.length-1),x=a[a.length-1-n],y=a[a.length-1];return x>0&&y>0?clip(Math.pow(y/x,1/n)-1,0,.15):0}
const FIN_CODES=new Set(['8306','8316','8473']);
function isFinancialCode(code){return FIN_CODES.has(String(code||''))}

function sectorPerMedian(ids){
  const a=(DS.jp&&DS.jp.s||[]).filter(p=>ids.includes(secOf(p))).map(p=>p._per).filter(v=>isNum(v)&&v>=4&&v<=40);
  return median(a);
}

// 三菱商事SOTP：2026-11-04会社予想（純利益1.2兆円）のセグメント別見通しを使用。
// 一過性利益はPERを掛けず、継続利益だけを対応業種PERで評価する。
const MC_SOTP={
  asOf:'2026-11-04',oneTimeOtherBn:120,
  segments:[
    {name:'Energy & Power Solution',profitBn:383,sectors:[1,10]},
    {name:'Materials Solution',profitBn:43,sectors:[3,6]},
    {name:'Mineral Resources',profitBn:230,sectors:[1,6]},
    {name:'Urban Development & Infrastructure',profitBn:90,sectors:[2,16]},
    {name:'Mobility',profitBn:100,sectors:[5]},
    {name:'Food Industry',profitBn:65,sectors:[0]},

  ],otherBn:159
};
function sotp8058(x){

  for(const z of MC_SOTP.segments){
    const per=sectorPerMedian(z.sectors),profit=z.profitBn*scale;if(!isNum(per))continue;
    const valueBn=profit*per;equityBn+=valueBn;rows.push({name:z.name,profitBn:profit,multiple:per,valueBn});
  }

  if(isNum(mp)){const valueBn=recurring*mp;equityBn+=valueBn;rows.push({name:'Other（継続分）',profitBn:recurring,multiple:mp,valueBn})}
  equityBn+=oneTime;rows.push({name:'資本回収・一過性',profitBn:oneTime,multiple:1,valueBn:oneTime});
  return equityBn>0?{value:equityBn*1e9/shares,rows,asOf:MC_SOTP.asOf,note:'会社予想セグメント純利益×対応業種PER中央値。一過性利益は1倍。'}:null;
}

// 楽天SOTP：FinTech再編後の楽天銀行持分＋Internet－非FinTech純有利子負債。

const RAKUTEN_SOTP={asOf:'2026-08-10',bankEqShares:293293023,bankDiscount:.90,internetH1OiBn:44.3,nonFintechEbitdaH1Bn:60.9,netDebtEbitda:6.2};

  return equityBn>0?{value:equityBn*1e9/shares,rows,asOf:RAKUTEN_SOTP.asOf,note:'楽天銀行持分＋Internet価値－非FinTech純有利子負債。Mobileは0評価。'}:null;

function peerModels(s,x,r,rimV){
  const cfg=MODEL_CONFIG[s.code];if(!cfg||mkOf(s)!=='jp')return null;
  const F=(s.f||[])[0]||[],gf=n=>F[col('fin',n)],sec=secOf(s);
  const peers=(DS.jp&&DS.jp.s||[]).filter(p=>p.code!==s.code&&(sec==null||secOf(p)===sec));
  const perMed=median(peers.map(p=>p._per).filter(v=>isNum(v)&&v>0&&v<100));
  const pbrMed=median(peers.map(p=>p._pbr).filter(v=>isNum(v)&&v>0&&v<10));
  const shares=isNum(x.mcap)&&isNum(x.px)&&x.px>0?x.mcap/x.px:null;
  const ibd=gf('有利子負債'),cash=gf('現金等 当期'),dep=gf('減価償却 実績'),op=actualOp(s);
  const netDebt=(isNum(ibd)?ibd:0)-(isNum(cash)?cash:0);
  const eb=isNum(op)&&isNum(dep)?op+dep:null;
  const evM=isNum(x.mcap)?x.mcap/1e6+netDebt:null;
  const peerEV=median(peers.map(p=>{
    const pi=inputs(p),PF=(p.f||[])[0]||[],pg=n=>PF[col('fin',n)],pop=actualOp(p),pdep=pg('減価償却 実績');
    if(!pi||!isNum(pi.mcap)||!isNum(pop)||!isNum(pdep)||pop+pdep<=0)return null;
    const pev=pi.mcap/1e6+(isNum(pg('有利子負債'))?pg('有利子負債'):0)-(isNum(pg('現金等 当期'))?pg('現金等 当期'):0);
    return pev>0?pev/(pop+pdep):null;
  }).filter(v=>isNum(v)&&v>0&&v<60));
  const fcfs=[gf('フリーCF 当期'),gf('フリーCF 前期')].filter(isNum),base=fcfs.length?fcfs.reduce((a,b)=>a+b,0)/fcfs.length:null;
  let dcf=null;
  if(isNum(base)&&base>0&&shares){
    const R=.08,G=.01,N=5,gr=salesGrowth(s);
    let pv=0;for(let t=1;t<=N;t++)pv+=base*Math.pow(1+gr,t)/Math.pow(1+R,t);
    pv+=base*Math.pow(1+gr,N)*(1+G)/(R-G)/Math.pow(1+R,N);
    const eq=pv-netDebt;if(eq>0)dcf=eq*1e6/shares;
  }
  const evm=isNum(peerEV)&&isNum(eb)&&shares?(peerEV*eb-netDebt)*1e6/shares:null;

  // 総還元モデル：配当＋自社株買いを1株あたり総還元額に直し、要求収益率8%・長期成長1%で資本還元。
  // 単年の大型買い戻しを永久化しないため、自社株買い部分は年5%を上限にする。
  const divYield=isNum(s._yld)&&s._yld>=0?s._yld:0;
  const buybackYield=isNum(s._shy)?Math.max(0,s._shy-divYield):null;
  const sustainableShy=isNum(s._shy)?clip(divYield+Math.min(buybackYield,.05),0,.12):null;
  const payoutPerShare=isNum(x.px)&&isNum(sustainableShy)?x.px*sustainableShy:null;
  const payoutReq=.08,payoutG=.01;
  const payoutFV=isNum(payoutPerShare)&&payoutPerShare>0?payoutPerShare/(payoutReq-payoutG):null;

  // 簡易FCFE：営業CF－設備投資。純借入を取得できないため除外していることを明示する。
  const cfo=gf('営業CF 当期'),capex=gf('設備投資 実績');
  const fcfeBase=!isFinancialCode(s.code)&&isNum(cfo)&&isNum(capex)?cfo-capex:null;
  let fcfeFV=null;
  if(isNum(fcfeBase)&&fcfeBase>0&&shares){
    const R=.08,G=.01,N=5,gr=salesGrowth(s);
    let pv=0;for(let t=1;t<=N;t++)pv+=fcfeBase*Math.pow(1+gr,t)/Math.pow(1+R,t);
    pv+=fcfeBase*Math.pow(1+gr,N)*(1+G)/(R-G)/Math.pow(1+R,N);
    if(pv>0)fcfeFV=pv*1e6/shares;
  }

  // EVA：NOPAT－WACC×投下資本。超過利益は10年でゼロへ収束すると仮定。
  const eq=gf('自己資本');
  const invested=!isFinancialCode(s.code)&&isNum(eq)?eq+netDebt:null;
  const nopat=!isFinancialCode(s.code)&&isNum(op)?op*.70:null;
  let evaFV=null,eva0=null,roic=null;
  if(isNum(invested)&&invested>0&&isNum(nopat)&&shares){
    const W=.08,N=10;
    roic=nopat/invested;
    eva0=nopat-W*invested;
    let pvEva=0;
    for(let t=1;t<=N;t++){
      const eva=eva0*(N-t+1)/N;
      pvEva+=eva/Math.pow(1+W,t);
    }
    const equityValue=invested+pvEva-netDebt;
    if(equityValue>0)evaFV=equityValue*1e6/shares;
  }

  // Reverse DCF：現在株価から、5年間に必要なFCF成長率を逆算。理論株価モデルではなく期待値の点検用。
  let reverseG=null,reverseBound=null;
  if(!isFinancialCode(s.code)&&isNum(base)&&base>0&&shares&&isNum(x.px)&&x.px>0){
    const R=.08,G=.01,N=5;
    const priceAt=g=>{
      let pv=0;for(let t=1;t<=N;t++)pv+=base*Math.pow(1+g,t)/Math.pow(1+R,t);
      pv+=base*Math.pow(1+g,N)*(1+G)/(R-G)/Math.pow(1+R,N);
      const equity=pv-netDebt;
      return equity>0?equity*1e6/shares:null;
    };
    let lo=-.20,hi=.40,plo=priceAt(lo),phi=priceAt(hi);
    if(isNum(plo)&&x.px<plo){reverseBound='<-20%'}
    else if(isNum(phi)&&x.px>phi){reverseBound='>40%'}
    else if(isNum(plo)&&isNum(phi)){
      for(let k=0;k<50;k++){const mid=(lo+hi)/2,pm=priceAt(mid);if(!isNum(pm))break;if(pm<x.px)lo=mid;else hi=mid}
      reverseG=(lo+hi)/2;
    }
  }

  const sotp=s.code==='8058'?sotp8058(x):s.code==='4755'?sotp4755(x):null;
  const vals={
    'SOTP':sotp&&sotp.value,
    '残余利益':rimV,
    '妥当PBR':isNum(x.roe)&&r>0?x.bps*(x.roe/r):null,
    '業種PER':isNum(perMed)?perMed*x.eps:null,
    '業種PBR':isNum(pbrMed)?pbrMed*x.bps:null,
    '業種EV/EBITDA':evm,
    'DCF':dcf,
    '総還元':payoutFV,
    '簡易FCFE':fcfeFV,
    'EVA':evaFV
  };
  const order=[cfg.primary,...cfg.refs];
  const rows=order.filter((k,i)=>order.indexOf(k)===i&&isNum(vals[k])&&vals[k]>0).map(k=>({name:k,value:vals[k]}));
  let primaryName=cfg.primary,primaryValue=vals[primaryName],fallback=false,fallbackReason='';
  if(!(isNum(primaryValue)&&primaryValue>0)){
    const alt=rows.find(z=>z.name!==cfg.primary);
    if(!alt)return null;
    primaryName=alt.name;primaryValue=alt.value;fallback=true;fallbackReason='主モデルを算出できないため';
  }

  // 品質ゲート：主モデルが参考モデルの中央値から極端に外れる場合だけ、中央値に最も近い参考モデルへ切り替える。
  // 加重平均はしない。あくまで「1モデル採用」のまま、異常値だけ除外する。
  const refRows=rows.filter(z=>z.name!==primaryName&&
    !['総還元','業種内回帰'].includes(z.name));
  const refMed=refRows.length>=3?median(refRows.map(z=>z.value)):null;
  const primaryVsRef=isNum(refMed)&&refMed>0?primaryValue/refMed:null;
  if(!fallback&&isNum(primaryVsRef)&&(primaryVsRef<.40||primaryVsRef>2.50)){
    const candidates=refRows.filter(z=>z.value>0).sort((a,b)=>Math.abs(Math.log(a.value/refMed))-Math.abs(Math.log(b.value/refMed)));
    if(candidates.length){
      const alt=candidates[0];
      fallback=true;
      fallbackReason='主モデルが参考モデル中央値から極端に乖離（'+Math.round((primaryVsRef-1)*100)+'%）';
      primaryName=alt.name;
      primaryValue=alt.value;
    }
  }

  return {value:primaryValue,primaryName,requestedPrimary:cfg.primary,fallback,fallbackReason,refMedian:refMed,primaryVsRef,rows,peerEV,perMed,pbrMed,fcfYears:fcfs.length,
    payoutFV,sustainableShy,payoutPerShare,payoutReq,payoutG,
    fcfeFV,fcfeBase,evaFV,eva0,roic,reverseG,reverseBound,sotp};
}
function inputs(s){
  if(s._in!==undefined) return s._in;
  const F=(s.f||[])[0]||[]; const gf=n=>F[col('fin',n)]; const L=s.l||[]; const g=n=>L[col('list',n)];
  const bps=gf('1株純資産（円）'), px=s._px;
  const act=(s.y||[]).filter(r=>r[col('years','区分')]==='実績'&&isNum(r[col('years','EPS（円）')])).map(r=>r[col('years','EPS（円）')]);
  let eps=g('今期予想EPS（円）'), epsSrc='今期予想EPS';
  if(!isNum(eps)&&act.length){eps=act[act.length-1];epsSrc='直近実績EPS'}
  if(!isNum(bps)||bps<=0||!isNum(eps)) return s._in=null;
  const np=g('今期予想純利益（百万円）');
  const mcap=(isNum(px)&&isNum(np)&&eps!==0&&np/eps>0)?px*np*1e6/eps:null;
  const dps=g('今期配当上限（円）');
  const last=act.length?act[act.length-1]:null;
  const hist=act.slice(-5).map(e=>e/bps);
  let sd=null; if(hist.length>=2){const m=hist.reduce((a,b)=>a+b,0)/hist.length; sd=clip(Math.sqrt(hist.reduce((a,b)=>a+(b-m)*(b-m),0)/hist.length),0,0.3)}
  return s._in={bps,eps,epsSrc,px,mcap,np,dps,roe:clip(eps/bps,-0.5,0.6),
    payout:eps>0&&isNum(dps)?clip(dps/eps,0,1):0.3,
    good:act.length>=3&&act.slice(-3).every(e=>e>0)&&eps>0,
    g:isNum(last)&&last>0?clip(eps/last-1,-0.5,1):null, sd};
}
function rim(bps,roe0,r,payout){let v=bps,b=bps;for(let t=1;t<=10;t++){const rt=r+(roe0-r)*(10-t+1)/10;v+=(rt-r)*b/Math.pow(1+r,t);b*=1+rt*(1-payout)}return v}
function theo(s){
  const x=inputs(s); if(!x) return null;
  const mY=yen(s,x.mcap); const r=!isNum(mY)?0.08:mY>=2.5e11?0.06:mY>=3e10?0.08:0.10;
  const ri=rim(x.bps,x.roe,r,x.payout); if(!(ri>0)) return null;
  const c2=s._c2, comp=peerModels(s,x,r,ri), v=comp&&comp.value>0?comp.value:ri;
  const cheapA=isNum(x.px)&&x.px<v;
  const shy=s._shy, SM=SHYM[mkOf(s)], shyHi=isNum(shy)&&isNum(SM)&&shy>=SM;
  const pick=x.good&&cheapA&&shyHi;
  const model=comp?comp.primaryName:'残余利益';
  const verdict=!x.good&&model==='残余利益'?'対象外（赤字期あり・参考値）':cheapA?model+'で割安':model+'で割高';
  return {value:Math.round(v),ri:Math.round(ri),comp,r,c2:isNum(c2)?Math.round(c2):null,verdict,shy,shyHi,pick,...x};
}
function safeTheo(s){try{return theo(s)}catch(e){console.error('valuation error',s&&s.code,e);return null}}
// 業種内回帰：データを読み込んだときに1回だけ全銘柄で当てはめる
function solve(A,y){ // 正規方程式 (A'A)β=A'y をガウスの消去法で解く
  const k=A[0].length, M=[...Array(k)].map(()=>Array(k+1).fill(0));

function latestActual(s,colName){
  const Y=n=>col('years',n),a=(s.y||[]).filter(r=>r[Y('区分')]==='実績'&&isNum(r[Y(colName)]));
  return a.length?a[a.length-1][Y(colName)]:null;
}
function forecastVal(s,name){
  const L=s.l||[],g=n=>L[col('list',n)]; const v=g(name); return isNum(v)?v:null;
}
function roeNow(s){
  const F=(s.f||[])[0]||[],gf=n=>F[col('fin',n)];
  return isNum(gf('ROE 予想'))?gf('ROE 予想'):isNum(gf('ROE 実績'))?gf('ROE 実績'):null;
}
function kpiCurrent(s,k){
  if(k.kind==='roe') return roeNow(s);
  if(k.kind==='npfc') return forecastVal(s,'今期予想純利益（百万円）');
  if(k.kind==='opfc') return forecastVal(s,'今期予想営業利益（百万円）');
  if(k.kind==='pretax_actual') return latestActual(s,'経常・税前利益（百万円）');
  if(k.kind==='np_peak'){
    const Y=n=>col('years',n),vals=(s.y||[]).filter(r=>r[Y('区分')]==='実績'&&isNum(r[Y('純利益（百万円）')])).map(r=>r[Y('純利益（百万円）')]);
    const cur=forecastVal(s,'今期予想純利益（百万円）'); const peak=vals.length?Math.max(...vals):null;
    return isNum(cur)&&isNum(peak)&&peak>0?cur/peak:null;
  }
  if(k.kind==='static_inverse') return k.current;
  if(k.kind==='op_hyp'){
    const op=forecastVal(s,'今期予想営業利益（百万円）'),sales=forecastVal(s,'今期予想売上高（百万円）');
    return isNum(op)&&isNum(sales)&&sales>0?op/sales:null;
  }
  return null;
}
function kpiProgress(s,k){
  const cur=kpiCurrent(s,k); if(!isNum(cur))return null;
  if(k.kind==='np_peak')return {cur,target:1,pct:cur};
  if(k.kind==='op_hyp')return {cur,target:k.targetMargin,pct:k.targetMargin>0?cur/k.targetMargin:null};
  if(k.kind==='static_inverse')return {cur,target:k.target,pct:cur>0?k.target/cur:null};
  return {cur,target:k.target,pct:k.target>0?cur/k.target:null};
}
function kpiFmt(v,k){
  if(!isNum(v))return '—';
  if(k.kind==='roe'||k.kind==='np_peak'||k.kind==='op_hyp'||k.unit==='%')return (v*100).toFixed(1)+'%';
  if(k.unit==='倍')return v.toFixed(1)+'倍';
  if(k.unit==='百万円')return v>=10000?(v/100).toLocaleString('ja-JP',{maximumFractionDigits:0})+'億円':v.toLocaleString('ja-JP')+'百万円';
  return fm(v,1);
}
function kpiPanel(code){
  const s=BY[code],ks=KPI_TARGETS[code]; if(!s||!ks)return '';
  const rows=ks.map(k=>({k,p:kpiProgress(s,k)})).filter(x=>x.p&&isNum(x.p.pct));
  if(!rows.length)return '';
  const score=rows.reduce((a,x)=>a+Math.min(1,Math.max(0,x.p.pct)),0)/rows.length;
  return '<div class="kpi-progress"><div class="kpi-progress-head"><b>数値KPI進捗</b><span class="kpi-score">'+Math.round(score*100)+'%</span></div>'+
    rows.map(({k,p})=>{const pct=p.pct,cls=pct>=1?'ok':pct>=.8?'warn':'bad',w=Math.max(0,Math.min(100,pct*100));
      return '<div class="kpi-row '+cls+'"><div class="kpi-row-top"><div><div class="name">'+esc(k.name)+'</div><div class="src">'+(k.url?'<a href="'+esc(k.url)+'" target="_blank" rel="noopener">'+esc(k.source)+'</a>':esc(k.source))+'</div></div><div class="pct">'+Math.round(pct*100)+'%</div></div>'+
      '<div class="nums">現在 '+kpiFmt(p.cur,k)+' ／ 目標 '+kpiFmt(p.target,k)+'</div><div class="kpi-track"><i style="width:'+w+'%"></i></div></div>'}).join('')+
    '<p class="small" style="margin:0">総合達成率は各KPIを100%上限で単純平均。目標の優先順位は「中期経営計画 → 会社予想 → 過去実績 → 投資仮説」。</p></div>';
}

function driverBox(code){
  const rows=DRV[code]||[]; if(!rows.length) return '';
  const link=t=>{const m=/https?:\/\/\S+/.exec(t||'');return m?' <a href="'+esc(m[0])+'" target="_blank" rel="noopener">出典</a>':''};
  let h='<details class="drv"><summary>売上ドライバー（'+rows.length+'項目）</summary><p class="small" style="margin:6px 0 0">売上・利益を構成要素に分けた数字。色は独自予想の前提と比べた判定（緑＝上振れ、赤＝下振れ、灰色＝想定どおり）。判定が無い項目は「更新」とだけ表示。数字は表示するだけで、このアプリでは計算していません。</p>', seg=null;
  for(const r of rows){
    if(r.seg!==seg){seg=r.seg;h+='<div class="drv-seg">'+esc(seg||'')+'</div>'}
    const has=!!(r.latest&&String(r.latest).trim()), at=has?r.latestAt:r.baseAt, none=!has&&/^未取得/.test(r.base||'');
    // 判定：N列（dir）。Apps Script が古くて届かないときは、最新値の先頭の【上振れ】などの印を読む
    let val=has?String(r.latest):r.base, dir=String(r.dir||'').trim();
    const tag=/^\s*【(上振れ|下振れ|想定どおり)】\s*/.exec(val||''); if(tag){if(!dir)dir=tag[1];val=val.replace(tag[0],'')}
    const dc=!has?'':/上振れ/.test(dir)?'up':/下振れ/.test(dir)?'down':/想定/.test(dir)?'flat':'';
    h+='<div class="drv-row'+(dc?' drv-'+dc:'')+'"><div class="drv-k">'+esc(r.item)+(r.unit?' <span class="small">（'+esc(r.unit)+'）</span>':'')+
      (dc?' <span class="pill drv-p-'+dc+'">'+(dc==='up'?'▲ 上振れ':dc==='down'?'▼ 下振れ':'想定どおり')+'</span>':has?' <span class="pill hold">更新</span>':'')+'</div>'+
      '<div class="drv-v num'+(none?' drv-none':'')+'">'+esc(val||'—')+'</div>'+
      (at?'<div class="small">'+esc(String(at).replace(/https?:\/\/\S+/g,'').replace(/[、,\s]+$/,''))+link(at)+(has&&r.base&&!/^未取得/.test(r.base)?'　基準：'+esc(r.base)+(r.baseAt?'（'+esc(r.baseAt)+'）':''):'')+'</div>':'')+
      (r.role?'<div class="small">'+esc(r.role)+'</div>':'')+(r.memo?'<div class="small">'+esc(r.memo)+'</div>':'')+'</div>';
  }
  return h+'</details>';
}

  else if(!o) h+='<div class="actions"><button class="btn" data-act="add" data-code="'+esc(code)+'"'+(W.busy||W.state==='loading'?' disabled':'')+'>監視に追加</button><button class="btn ghost" data-act="addhold" data-code="'+esc(code)+'"'+(W.busy||W.state==='loading'?' disabled':'')+'>保有に追加</button></div>';
  else h+='<div class="form"><label for="w-ovr">理論株価の上書き（'+(mkOf(s)==='jp'?'円':esc(s._pc))+'、空欄なら自動）<input id="w-ovr" inputmode="decimal" value="'+(isNum(o.ovr)?o.ovr:'')+'" placeholder="'+(t?t.value:'')+'"></label>'+
    '<label for="w-mult">売り倍率（理論株価の何倍で売り検討）<input id="w-mult" inputmode="decimal" value="'+(isNum(o.mult)?o.mult:1.2)+'"></label>'+
    '<label class="wide" for="w-memo">メモ（投資ストーリーなど）<input id="w-memo" value="'+esc(memoBody(o))+'"></label><label class="wide" style="display:flex;flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="w-hold" style="width:22px;height:22px;flex:none;margin:0"'+(isHold(o)?' checked':'')+'>保有中（「保有銘柄」タブに表示）</label></div>'+
    '<div class="actions"><button class="btn" data-act="save" data-code="'+esc(code)+'"'+(W.busy?' disabled':'')+'>保存</button><button class="btn danger" data-act="remove" data-code="'+esc(code)+'"'+(W.busy?' disabled':'')+'>監視から外す</button></div>';
  h+='</div>';
  if(o&&isHold(o)||holdOf(code)) h+='<div class="theo" style="margin-top:12px">'+storyBox(code)+'</div>';
  return h;
}

// ===== 端末内のデータ保存（IndexedDB） =====
function idb(){return new Promise((ok,ng)=>{try{const r=indexedDB.open('shikiho-viewer',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}catch(e){ng(e)}})}
async function idbGet(k){try{const db=await idb();return await new Promise((ok,ng)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise((ok,ng)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>ng(t.error);t.onabort=()=>ng(t.error);setTimeout(()=>ng(new Error('idb_timeout')),15000)})}catch(e){}}
let S={busy:false,msg:null};
async function fetchData(m){
  m=m||MK;
  S.busy=true; S.msg={t:MKN[m]+'のデータを取得中…（初回は20〜40秒ほどかかります）'}; if(location.hash==='#settings') renderSettings();
  try{ const j=await api('data',null,{market:m}); const d=j.data;
    if((d.market||'jp')!==m){ const x=new Error('old_gas'); x.code='old_gas'; throw x; }
    d.fetchedAt=new Date().toISOString(); DS[m]=d; prep(); idbSet(IDB[m],d); S.msg={t:MKN[m]+'：'+d.s.length.toLocaleString()+'銘柄のデータを取り込みました。'}; S.busy=false; return true; }
  catch(e){ S.busy=false; S.msg={t:'データを取得できませんでした。'+errText(e),err:true}; return false; }
  finally{ if(location.hash==='#settings') renderSettings(); }
}

// シートは平日20:37にJ-Quantsで更新される。手元のデータがその後の取り込みでなければ、裏で取り込み直す
function lastUpdate(){
  const jst=new Date(Date.now()+9*3600e3); let d=new Date(Date.UTC(jst.getUTCFullYear(),jst.getUTCMonth(),jst.getUTCDate(),21-9));
  if(Date.now()<d.getTime()) d=new Date(d.getTime()-864e5);
  while([0,6].includes(new Date(d.getTime()+9*3600e3).getUTCDay())) d=new Date(d.getTime()-864e5);
  return d.getTime();
}
let refreshing=false, triedNew=false; var OLD_GAS=false;
async function autoRefresh(){
  const noNew=MK==='jp'&&D&&D.g17===undefined&&!triedNew;   // 成長17分野・営業利益/EVの順位が入る前の古いデータなら、一度だけ取り直す
  const fresh=D&&(MK==='jp'?Date.parse(D.fetchedAt||0)>=lastUpdate():Date.now()-Date.parse(D.fetchedAt||0)<864e5);
  if(refreshing||!cfg()||!D||(fresh&&!noNew)) return;
  if(noNew) triedNew=true;
  refreshing=true; brand('最新データを取り込み中…');
  const ok=await fetchData(); refreshing=false;
  if(ok){ const typing=document.activeElement&&document.activeElement.tagName==='INPUT'; if(!typing) route(); }
  else brand(MKN[MK]+'・'+D.s.length.toLocaleString()+'銘柄（更新できず）');
}

document.addEventListener('click',e=>{const el=e.target.closest('button,.btn,.chip,.more,.tabs a');if(!el||el.disabled)return;

  if(location.hash!=='#settings') location.hash='settings'; else renderSettings();
}
function route(){ if(location.hash==='#models'){renderModels();return} if(location.hash==='#settings'){renderSettings();return} if(!D){ if(!cfg()) location.hash='settings'; return } W.msg=null; if(location.hash==='#watch'){renderWatch('watch');return} if(location.hash==='#hold'){renderWatch('hold');return} if(location.hash==='#search'){renderSearch();return} const m=location.hash.match(/^#s-([0-9A-Za-z.\-]+)$/); if(m){renderDetail(m[1].toUpperCase());return} location.hash='hold'; }
let t; qEl.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{if(qEl.value.trim()){if(location.hash!=='#search')location.hash='search';else renderSearch()}else location.hash='hold'},120)});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=qEl.value.trim().toUpperCase().normalize('NFKC');const hk=v.padStart(4,'0')+'.HK';const exact=BY[v]?v:BY[hk]?hk:null;if(exact){location.hash='s-'+exact;return}const m=D.s.find(s=>s._key.includes(v.toLowerCase()));if(m)location.hash='s-'+m.code}});
mkEl.addEventListener('change',async()=>{ MK=mkEl.value; store.set('shk-mk',MK); D=DS[MK]||null; H=D&&D.h; brand(); shown=100; qEl.value='';
  history.replaceState(null,'',location.pathname+location.search+'#hold');

    if(!(await fetchData(MK))){ app.innerHTML='<div class="empty">'+esc((S.msg&&S.msg.t)||'取得できませんでした')+'</div>'; return; } }
  renderWatch('hold'); autoRefresh(); });
window.addEventListener('hashchange',route);
boot();
