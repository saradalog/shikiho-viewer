<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>適時開示ウォッチは移転しました</title>
<meta http-equiv="refresh" content="0; url=https://saradalog.github.io/kaiji-watch/">
<script>
// 2026-11-24：適時開示ウォッチは saradalog/kaiji-watch に移った。ここに残った古い sw.js を外してから移る
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/kaiji\/$/.test(r.scope))r.unregister()}))}
location.replace('https://saradalog.github.io/kaiji-watch/'+location.hash);
</script></head>
<body><p><a href="https://saradalog.github.io/kaiji-watch/">適時開示ウォッチ（新しい場所）を開く</a></p></body></html>
