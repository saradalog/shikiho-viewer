<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開示">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>適時開示ウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 紙面の版面を思わせる罫線主体のレイアウト。実績＝藍、予想＝紫で全画面統一 */
:root{
  --paper:#f6f6f2; --surface:#ffffff; --ink:#1d2230; --muted:#666c7a; --rule:#d9dadf;
  --accent:#27407a; --fc:#7a4fb0; --fc-soft:#e6dcf3; --act-soft:#d8e0f0;
  --up:#1e7a4a; --down:#b23a3a; --buy-soft:#dcefe3; --sell-soft:#f6dede;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161c; --surface:#1c1f27; --ink:#e7e8ec; --muted:#9a9fac; --rule:#30343f;
  --accent:#8fa8e6; --fc:#b994e6; --fc-soft:#3a2f4d; --act-soft:#2a3550; --up:#5cc58d; --down:#f08080; --buy-soft:#1f3a2b; --sell-soft:#43262a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#14161c; --surface:#1c1f27; --ink:#e7e8ec; --muted:#9a9fac; --rule:#30343f;
  --accent:#8fa8e6; --fc:#b994e6; --fc-soft:#3a2f4d; --act-soft:#2a3550; --up:#5cc58d; --down:#f08080; --buy-soft:#1f3a2b; --sell-soft:#43262a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.num,table{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header.top{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-top:12px;padding-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
section{margin-top:22px}
section h3{font-family:var(--display);font-size:17px;margin:0 0 8px;padding-left:8px;border-left:4px solid var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.small{font-size:12px;color:var(--muted)}
.empty{padding:28px 0;color:var(--muted)}
.loading{padding:40px 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs a{white-space:nowrap;padding:6px 12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
@media (max-width:420px){.tabs{gap:0}.tabs a{padding:6px 6px;font-size:13px}}
#tdcount{margin-left:6px;font-size:11px;color:#fff;background:var(--down);border-radius:999px;padding:0 6px}
#tdcount:empty{display:none}
.td-row{border-bottom:1px solid var(--rule);padding:10px 2px;display:grid;gap:4px}
.td-row.read{opacity:.62}
.td-row.mine{border-left:3px solid var(--accent);padding-left:8px}
.td-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.td-nm{font-weight:700}
.td-star{color:#c9a000}
.td-b{font-size:14px;overflow-wrap:anywhere}
.td-title{overflow-wrap:anywhere}
.td-memo{font-size:13px;background:var(--fc-soft);border-radius:6px;padding:4px 8px;white-space:pre-wrap}
.td-a{display:flex;gap:6px;flex-wrap:wrap}
.td-a .btn{padding:3px 10px;font-size:12px;text-decoration:none}
.td-edit{display:grid;gap:6px}
.td-edit textarea{width:100%;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font:inherit}
.td-note{white-space:pre-wrap;font-size:14px;display:block}
.td-sec{border-top:1px solid var(--rule)}
.td-sh,.td-sr{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr 52px;gap:8px;align-items:center;padding:6px 2px}
.td-sr{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;font-size:13px}
.td-sr.on{background:var(--act-soft)}
.td-cell{display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center}
.td-cell .small{grid-column:1/-1}
.td-bar{display:block;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.td-bar i{display:block;height:100%}
#tdDate{padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.buy{background:var(--buy-soft);color:var(--up)}
.pill.sell{background:var(--sell-soft);color:var(--down)}
.pill.hold{background:var(--rule);color:var(--muted)}
.wsum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 8px}
.wsum .grow{flex:1}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--down);border-color:var(--down)}
.btn:disabled{opacity:.5;cursor:default}
.theo{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.theo .big{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.theo .big div{display:grid}
.theo .big span{font-size:11.5px;color:var(--muted)}
.theo .big b{font-size:22px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form input{min-width:0;width:100%}
.form input{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15px;color:var(--ink)}
.form .wide{grid-column:1 / -1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill.warn{background:#f9eeda;color:#8a5a00}
.pill.drv-p-up{background:var(--buy-soft);color:var(--up)}
.pill.drv-p-down{background:var(--sell-soft,#f7dede);color:var(--down)}
.pill.drv-p-flat{background:var(--rule);color:var(--muted)}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--fc-soft)}
.msg.err{background:var(--sell-soft);color:var(--down)}
/* 押した感：押している間は少し縮んで色が濃くなる。押したあと一瞬光る */
html{-webkit-tap-highlight-color:transparent}
.btn,.chip,.more,.tabs a,.wrow,ul.list li a,.back,.recent a{transition:transform .08s ease,background-color .12s ease,filter .12s ease,box-shadow .2s ease}
.btn:active:not(:disabled),.chip:active,.more:active{transform:scale(.95);filter:brightness(.88)}
.tabs a:active{background:var(--rule)}
.tapped{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (prefers-reduced-motion:reduce){.btn,.chip,.more,.tabs a,.wrow,ul.list li a{transition:none}.btn:active:not(:disabled),.chip:active,.more:active{transform:none}}
.code{font-weight:700;color:var(--accent);overflow-wrap:anywhere;text-decoration:none}
/* 開示アプリ専用：見出しの色だけ赤系にして四季報ビューアと見分ける */
.brand h1{color:#8a2b2b}
@media (prefers-color-scheme: dark){.brand h1{color:#f08080}}
.brand a{font-size:12px;color:var(--accent);text-decoration:none;margin-left:auto}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>適時開示ウォッチ</h1><span id="brand-sub">日本・米国・香港</span><a href="../">四季報ビューア ↗</a></div>
  <nav class="tabs" aria-label="画面切り替え"><a href="#tdnet" id="t-tdnet">開示<span id="tdcount"></span></a><a href="#settings" id="t-settings" style="margin-left:auto">設定</a></nav>
</div></header>
<main class="wrap" id="app"><div class="loading">読み込んでいます…</div></main>
<script>
(function(){
// 四季報ビューアの「開示」タブ（v46〜v48）を独立させたアプリ（2026-11-24）。
// 同じ Apps Script（action: tdnet / tdnetMark / list）を使う。同じ saradalog.github.io なので、
// 接続設定（shk-cfg）・開示のキャッシュ（shk-tdnet）・絞り込み（shk-tdf）は四季報ビューアと共有される。
const app=document.getElementById('app');
const SHK='../';   // 銘柄コードを押すと四季報ビューアの銘柄詳細を開く
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function isNum(x){return typeof x==='number'&&isFinite(x)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setTab(t){for(const k of ['tdnet','settings']){const el=document.getElementById('t-'+k); if(el) el.setAttribute('aria-current',t===k?'page':'false')}}
function cfg(){return store.get('shk-cfg',null)}
async function api(action,body,params){
  const c=cfg(); if(!c||!c.url||!c.token){const e=new Error('nocfg');e.code='nocfg';throw e}
  let res;
  try{
    const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),60000);
    if(body){ res=await fetch(c.url,{signal:ac.signal,method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:c.token},body))}); }
    else { res=await fetch(c.url+(c.url.includes('?')?'&':'?')+'action='+action+'&token='+encodeURIComponent(c.token)+Object.entries(params||{}).map(([k,v])=>'&'+k+'='+encodeURIComponent(v)).join(''),{signal:ac.signal}); }
    clearTimeout(tm);
  }catch(e){const x=new Error('offline');x.code=e&&e.name==='AbortError'?'timeout':navigator.onLine===false?'offline':'network';throw x}
  let j; try{j=await res.json()}catch(e){const x=new Error('bad_response');x.code='bad_response';throw x}
  if(!j.ok){const x=new Error(j.error||'error');x.code=j.error==='unauthorized'?'unauthorized':'api';throw x}
  return j;
}
function errText(e){
  const c=e&&e.code;
  if(c==='nocfg') return '接続先がまだ設定されていません。「設定」でApps ScriptのURLと合言葉を入れてください（四季報ビューアと同じもの）。';
  if(c==='offline') return 'オフラインです。前回読み込んだ内容を表示しています。';
  if(c==='network') return 'Apps Scriptにつながりませんでした。URLが正しいか確認してください。';
  if(c==='bad_response') return 'Apps Scriptから想定外の応答が返りました。URLが「/exec」で終わるウェブアプリのURLか確認してください。';
  if(c==='unauthorized') return '合言葉が一致しません。「設定」で入れ直してください。';
  if(c==='timeout') return 'Apps Scriptからの応答が1分以上ありませんでした。';
  return 'スプレッドシート側でエラーになりました：'+((e&&e.message)||'');
}
// 保有・監視の印に使う一覧（四季報ビューアと同じ list。端末キャッシュ shk-watch も共有）
const cachedW=store.get('shk-watch',null);
const W={rows:(cachedW&&cachedW.rows)||[]}; let HD=(cachedW&&cachedW.hold)||{holds:[]};
const holdOf=code=>(HD.holds||[]).find(h=>h.code===code);
const isHold=o=>/^保有/.test(String(o.memo||''))||!!holdOf(o.code);
let WAT=0;
async function readWatch(){
  if(!cfg()||Date.now()-WAT<10*60e3) return; WAT=Date.now();
  try{ const j=await api('list'); W.rows=j.rows||[]; if(j.hold) HD=j.hold;
    const old=store.get('shk-watch',{})||{}; store.set('shk-watch',Object.assign(old,{rows:W.rows,at:Date.parse(j.at)||Date.now(),hold:HD}));
    tdCount(); if(location.hash!=='#settings') renderTdnet(); }catch(e){}
}
// ===== 適時開示ウォッチ（2026-11-20）=====
// Claudeの予定タスク「適時開示の判定と方向感」が監視シートの「開示ウォッチ」「決算明細」「方向コメント」に書いたものを表示するだけ。
// ここでは開示を判定しない。業種の集計は「決算明細」の伸び率（PCのPythonがXBRLから出した値）を数えて中央値を取るだけ。
let TD=store.get('shk-tdnet',null)||{items:[],fins:[],notes:[],marks:{},at:0};
const TDS={state:'init',err:null,busy:false,open:{}};
const TDF=Object.assign({mine:false,star:false,unread:false,dir:'',hi:false,date:'',sec:'',win:20,mkt:'jp'},store.get('shk-tdf',{}));
// 市場はコードの形で見分ける（日本＝4桁、香港＝.HK、それ以外＝米国ティッカー）。米国の方向コメントは「【米国】」で始まる
const tdMkt=c=>/^[0-9][0-9A-Z]{3}$/.test(String(c||''))?'jp':/\.HK$/i.test(String(c||''))?'hk':'us';
const tdNoteMkt=t=>/^【米国】/.test(t||'')?'us':/^【香港】/.test(t||'')?'hk':'jp';
const tdSave=()=>store.set('shk-tdf',TDF);
const tdItem=r=>({d:r[0],t:r[1],code:r[2],name:r[3],cap:r[4],kind:r[5],dir:r[6],imp:r[7],body:r[8],src:r[9],title:r[10],pdf:r[11]});
const tdKey=o=>o.pdf||(o.d+'|'+o.code+'|'+o.title);
const tdMark=k=>(TD.marks||{})[k]||[false,false,'',''];
const tdDay=d=>d&&d.length>=8?(+d.slice(4,6))+'/'+(+d.slice(6,8)):'';
function tdCap(m,code){ if(!isNum(m)) return ''; const o=m/100; const mk=tdMkt(code), u=mk==='jp'?'円':mk==='hk'?'香港ドル':'ドル'; return o>=10000?(o/10000).toFixed(1)+'兆'+u:Math.round(o).toLocaleString('ja-JP')+'億'+u; } // 日本は百万円、米国は百万ドル、香港は百万香港ドル
function tdMine(){ const o={}; for(const r of W.rows||[]) o[r.code]=isHold(r)?'保有':'監視'; return o; }
function tdMed(xs){ xs=xs.filter(isNum).sort((a,b)=>a-b); if(!xs.length) return null; const m=xs.length>>1; return xs.length%2?xs[m]:(xs[m-1]+xs[m])/2; }
function tdPc(x){ return isNum(x)?(x>0?'+':'')+x.toFixed(1)+'%':'—'; }
async function readTdnet(force){
  if(TDS.busy) return; if(!force&&TD.at&&Date.now()-TD.at<10*60e3) return;
  if(!cfg()){TDS.state='nocfg'; return}
  TDS.busy=true; if(location.hash!=='#settings') renderTdnet();
  try{ const j=await api('tdnet',null,{days:90}); TD={items:j.items||[],fins:j.fins||[],notes:j.notes||[],marks:j.marks||{},at:Date.now()}; store.set('shk-tdnet',TD); TDS.state='ok'; TDS.err=null; }
  catch(e){ TDS.state='err'; TDS.err=(e.code==='api'&&/unknown_action/.test(e.message||''))?'Apps Script（Code.gs）が古いため開示を読めません。新しいCode.gsを貼り替えて「新しいバージョン」でデプロイしてください。':errText(e); }
  finally{ TDS.busy=false; tdCount(); if(location.hash!=='#settings') renderTdnet(); }
}
function tdCount(){ // 最新日の、未読で（保有・監視 または 重要度4以上）の件数
  const el=document.getElementById('tdcount'); if(!el) return;
  const its=(TD.items||[]).map(tdItem); const last=its.reduce((a,o)=>o.d>a?o.d:a,''); const mine=tdMine();
  const n=its.filter(o=>o.d===last&&!tdMark(tdKey(o))[0]&&(mine[o.code]||(isNum(o.imp)&&o.imp>=4&&o.dir!=='中立'))).length;
  el.textContent=n?String(n):'';
}
function tdRow(o,mine){
  const k=tdKey(o), m=tdMark(k), own=mine[o.code];
  const cls=o.dir==='良い'?'buy':o.dir==='悪い'?'sell':'hold', lab=o.dir==='良い'?'プラス':o.dir==='悪い'?'マイナス':'中立';
  const link='<a class="code" href="'+SHK+'#s-'+esc(o.code)+'" title="四季報ビューアで開く">'+esc(o.code)+'</a>';
  let h='<div class="td-row'+(m[0]?' read':'')+(own?' mine':'')+'">'+
    '<div class="td-h"><span class="pill '+cls+'">'+lab+(isNum(o.imp)?' '+o.imp:'')+'</span>'+link+'<b class="td-nm">'+esc(o.name)+'</b>'+(own?'<span class="pill '+(own==='保有'?'buy':'warn')+'">'+own+'</span>':'')+(m[1]?'<span class="td-star" aria-label="気になる">★</span>':'')+'</div>'+
    '<div class="td-b">'+esc(o.body||o.title)+'</div>'+
    '<div class="small">'+esc([tdDay(o.d)+' '+(o.t||''),tdCap(o.cap,o.code),o.kind,o.src?'判定：'+o.src:''].filter(Boolean).join('・'))+'</div>'+
    (o.body&&o.title&&o.body!==o.title?'<div class="small td-title">'+esc(o.title)+'</div>':'')+
    (m[2]&&!TDS.open[k]?'<div class="td-memo">'+esc(m[2])+'</div>':'')+
    '<div class="td-a"><button class="btn ghost" data-td="read" data-k="'+esc(k)+'">'+(m[0]?'未読に戻す':'既読')+'</button>'+
    '<button class="btn ghost" data-td="star" data-k="'+esc(k)+'">'+(m[1]?'★ 外す':'☆ 気になる')+'</button>'+
    '<button class="btn ghost" data-td="memo" data-k="'+esc(k)+'">メモ</button>'+
    (o.pdf?'<a class="btn ghost" href="'+esc(o.pdf)+'" target="_blank" rel="noopener">PDF</a>':'')+'</div>';
  if(TDS.open[k]) h+='<div class="td-edit"><textarea id="tdm-'+esc(k.replace(/[^0-9A-Za-z]/g,''))+'" rows="3" placeholder="この開示についてのメモ">'+esc(m[2])+'</textarea><button class="btn" data-td="memosave" data-k="'+esc(k)+'" data-code="'+esc(o.code)+'">メモを保存</button></div>';
  return h+'</div>';
}
function tdSectors(){ // 業種別：決算（前年同期比）と業績予想の修正
  const fins=(TD.fins||[]).map(r=>({d:r[0],code:r[1],name:r[2],sec:r[3]||'不明',cap:r[4],kind:r[5],per:r[6],sg:r[7],pitem:r[8],pg:r[9]})).filter(f=>tdMkt(f.code)===TDF.mkt);
  const days=[...new Set(fins.map(f=>f.d))].sort().reverse(); const use=new Set(days.slice(0,TDF.win));
  const fs=fins.filter(f=>use.has(f.d)); const by={};
  for(const f of fs){ const s=by[f.sec]||(by[f.sec]={sec:f.sec,k:[],up:0,dn:0}); if(f.kind==='決算') s.k.push(f); else if(isNum(f.pg)){ if(f.pg>0)s.up++; else if(f.pg<0)s.dn++; } }
  const rows=Object.values(by).map(s=>{ const sg=s.k.filter(f=>isNum(f.sg)), pg=s.k.filter(f=>isNum(f.pg));
    return {sec:s.sec,n:s.k.length,rev:sg.length?sg.filter(f=>f.sg>0).length/sg.length*100:null,revMed:tdMed(sg.map(f=>f.sg)),prof:pg.length?pg.filter(f=>f.pg>0).length/pg.length*100:null,profMed:tdMed(pg.map(f=>f.pg)),up:s.up,dn:s.dn}; })
    .sort((a,b)=>b.n-a.n);
  const allK=fs.filter(f=>f.kind==='決算'), sgA=allK.filter(f=>isNum(f.sg)), pgA=allK.filter(f=>isNum(f.pg));
  const tot={n:allK.length,rev:sgA.length?sgA.filter(f=>f.sg>0).length/sgA.length*100:null,revMed:tdMed(sgA.map(f=>f.sg)),prof:pgA.length?pgA.filter(f=>f.pg>0).length/pgA.length*100:null,profMed:tdMed(pgA.map(f=>f.pg)),
    up:fs.filter(f=>f.kind!=='決算'&&isNum(f.pg)&&f.pg>0).length,dn:fs.filter(f=>f.kind!=='決算'&&isNum(f.pg)&&f.pg<0).length};
  return {rows,tot,from:days.slice(0,TDF.win).pop()||'',fins};
}
function tdTrend(fins,sec){ // 週ごとの 増収の割合・増益の割合（決算のみ。社数5社未満の週は点を打たない）
  const wk=d=>{const t=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)); const w=(t.getDay()+6)%7; t.setDate(t.getDate()-w); return t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0');};
  const g={}; for(const f of fins){ if(f.kind!=='決算'||(sec&&f.sec!==sec)) continue; const k=wk(f.d); const o=g[k]||(g[k]={k,s:[],p:[]}); if(isNum(f.sg))o.s.push(f.sg); if(isNum(f.pg))o.p.push(f.pg); }
  const pts=Object.values(g).sort((a,b)=>a.k<b.k?-1:1).map(o=>({k:o.k,n:Math.max(o.s.length,o.p.length),rev:o.s.length>=5?o.s.filter(x=>x>0).length/o.s.length*100:null,prof:o.p.length>=5?o.p.filter(x=>x>0).length/o.p.length*100:null}));
  if(!pts.length) return '<p class="small">まだ週ごとの点を打てるだけの決算がありません。</p>';
  const Wd=340,Hd=150,L=30,R=8,T=10,B=26, x=i=>L+(pts.length===1?(Wd-L-R)/2:i*(Wd-L-R)/(pts.length-1)), y=v=>T+(100-v)*(Hd-T-B)/100;
  const line=(key,col)=>{ let d='',dots=''; pts.forEach((p,i)=>{ if(!isNum(p[key])){ return } d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(p[key]).toFixed(1); dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p[key]).toFixed(1)+'" r="3" fill="'+col+'"><title>'+tdDay(p.k)+'週 '+Math.round(p[key])+'%（'+p.n+'社）</title></circle>'; }); return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+dots; };
  let s='<svg viewBox="0 0 '+Wd+' '+Hd+'" role="img" aria-label="週ごとの増収・増益の割合" style="width:100%;max-width:520px;height:auto">';
  for(const v of [0,50,100]) s+='<line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--rule)"/><text x="'+(L-4)+'" y="'+(y(v)+4)+'" font-size="10" text-anchor="end" fill="var(--muted)">'+v+'%</text>';
  const step=Math.max(1,Math.ceil(pts.length/6)); pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) s+='<text x="'+x(i)+'" y="'+(Hd-8)+'" font-size="10" text-anchor="'+(i===pts.length-1&&pts.length>1?'end':'middle')+'" fill="var(--muted)">'+tdDay(p.k)+'</text>'; });
  s+=line('rev','var(--accent)')+line('prof','var(--fc)')+'</svg>';
  return s+'<div class="legend small"><span style="white-space:nowrap"><i style="background:var(--accent)"></i>増収の割合</span> <span style="white-space:nowrap"><i style="background:var(--fc)"></i>増益の割合</span></div><p class="small">横軸は週の初日（月曜）。その週に決算を出した会社のうち、増収・増益だった割合。</p>';
}
function renderTdnet(){
  setTab('tdnet'); TDS.state=cfg()?TDS.state:'nocfg';
  const mine=tdMine();
  const its=(TD.items||[]).map(tdItem).filter(o=>tdMkt(o.code)===TDF.mkt).sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)||((b.imp||0)-(a.imp||0)));
  const dates=[...new Set(its.map(o=>o.d))].sort().reverse();
  let h='<div class="chips" style="margin-top:12px">'+[['jp','日本株'],['us','米国株（S&P500）'],['hk','香港株（ハンセン指数）']].map(([k,l])=>'<button class="chip" data-td="mkt" data-m="'+k+'" aria-pressed="'+(TDF.mkt===k)+'">'+l+'</button>').join('')+'</div><div class="wsum"><select id="tdDate" aria-label="日付"><option value="">直近30日すべて</option>'+dates.map(d=>'<option value="'+d+'"'+(TDF.date===d?' selected':'')+'>'+tdDay(d)+'</option>').join('')+'</select>'+
    '<span class="grow small">'+(TDS.busy?'読み込み中…':TD.at?new Date(TD.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 時点':'')+'</span><button class="btn ghost" data-td="reload"'+(TDS.busy?' disabled':'')+'>更新</button></div>';
  if(TDS.state==='nocfg') h+='<div class="msg err">'+esc(errText({code:'nocfg'}))+'</div>';
  if(TDS.err) h+='<div class="msg err">'+esc(TDS.err)+'</div>';
  if(!its.length&&!(TD.fins||[]).some(r=>tdMkt(r[1])===TDF.mkt)){ h+='<div class="empty">'+(TDS.busy?'読み込んでいます…':(TDF.mkt==='us'?'米国株の開示はまだありません。平日20時ごろに、Claudeの予定タスクが前日の米国分を書き込みます。':TDF.mkt==='hk'?'香港株の開示はまだありません。平日20時すぎに、Claudeの予定タスクが書き込みます。':'まだ開示のデータがありません。平日19時すぎに、Claudeの予定タスクが毎日書き込みます。'))+'</div>'; app.innerHTML=h; return; }

  // 1) 業績の方向感（Claudeのコメント）
  const notes=(TD.notes||[]).filter(n=>tdNoteMkt(n[1])===TDF.mkt).sort((a,b)=>a[0]<b[0]?1:-1); const note=TDF.date?notes.find(n=>n[0]===TDF.date):notes[0];
  if(note) h+='<section><h3>業績の方向感 <span class="small">'+tdDay(note[0])+'・Claude</span></h3><div class="theo td-note">'+esc(String(note[1]).replace(/^【(米国|香港)】\s*/,''))+'</div></section>';

  // 2) 業種別の表とグラフ
  const SX=tdSectors();
  h+='<section><h3>'+(TDF.mkt==='jp'?'業種別の決算と業績修正':TDF.mkt==='us'?'業種別の決算（S&P500）':'業種別の決算（ハンセン指数）')+'</h3><div class="chips">'+[5,20,60].map(n=>'<button class="chip" data-td="win" data-n="'+n+'" aria-pressed="'+(TDF.win===n)+'">直近'+n+'日</button>').join('')+'</div>'+
    '<p class="small">'+(SX.from?tdDay(SX.from)+'〜の決算 '+SX.tot.n+'社：増収 '+(isNum(SX.tot.rev)?Math.round(SX.tot.rev)+'%':'—')+'（売上の伸び 中央値 '+tdPc(SX.tot.revMed)+'）・増益 '+(isNum(SX.tot.prof)?Math.round(SX.tot.prof)+'%':'—')+'（利益の伸び 中央値 '+tdPc(SX.tot.profMed)+(TDF.mkt==='jp'?'）／業績修正 上方 '+SX.tot.up+'・下方 '+SX.tot.dn:'）'):'決算のデータがまだありません')+'</p>';
  if(SX.rows.length){
    h+='<div class="td-sec"><div class="td-sh small"><span>業種（社数）</span><span>増収の割合</span><span>増益の割合</span><span>'+(TDF.mkt==='jp'?'修正':'')+'</span></div>'+SX.rows.map(r=>{
      const bar=(v,col)=>isNum(v)?'<span class="td-bar"><i style="width:'+v.toFixed(0)+'%;background:'+col+'"></i></span><span class="num">'+Math.round(v)+'%</span>':'<span class="small">—</span>';
      return '<button class="td-sr'+(TDF.sec===r.sec?' on':'')+'" data-td="sec" data-s="'+esc(r.sec)+'"><span>'+esc(r.sec)+' <span class="small">('+r.n+')</span></span>'+
        '<span class="td-cell">'+bar(r.rev,'var(--accent)')+'<span class="small">中央 '+tdPc(r.revMed)+'</span></span>'+
        '<span class="td-cell">'+bar(r.prof,'var(--fc)')+'<span class="small">中央 '+tdPc(r.profMed)+'</span></span>'+
        (TDF.mkt==='jp'?'<span class="num"><span style="color:var(--up)">↑'+r.up+'</span> <span style="color:var(--down)">↓'+r.dn+'</span></span>':'<span></span>')+'</button>'; }).join('')+'</div>'+
      '<p class="small">社数が5社未満の業種は、割合が大きく振れるので参考程度に。行を押すと、下のグラフがその業種になります。'+(TDF.mkt==='us'?'米国はSECの四半期報告書（10-Q・10-K）の提出日で数えるので、決算発表から数週間遅れます。ガイダンスの上げ下げは下の開示一覧（Claudeが決算発表を読んだもの）で見てください。':TDF.mkt==='hk'?'香港にはXBRLが無いので、決算の数字はClaudeが決算発表を読んで入れたものです。':'')+'</p>';
  }
  h+='<h3 style="font-size:15px">週ごとの推移 <span class="small">'+(TDF.sec?esc(TDF.sec)+' <button class="chip" data-td="sec" data-s="">全業種に戻す</button>':'全業種')+'</span></h3>'+tdTrend(SX.fins,TDF.sec)+'</section>';

  // 3) 保有・監視銘柄の開示（直近30日・重要度を問わず）
  const minIts=its.filter(o=>mine[o.code]);
  if(minIts.length) h+='<section><h3>保有・監視銘柄の開示 <span class="small">'+minIts.length+'件</span></h3>'+minIts.slice(0,30).map(o=>tdRow(o,mine)).join('')+'</section>';

  // 4) 開示の一覧
  let list=its.filter(o=>!TDF.date||o.d===TDF.date);
  if(TDF.mine) list=list.filter(o=>mine[o.code]);
  if(TDF.star) list=list.filter(o=>tdMark(tdKey(o))[1]);
  if(TDF.unread) list=list.filter(o=>!tdMark(tdKey(o))[0]);
  if(TDF.dir) list=list.filter(o=>o.dir===TDF.dir);
  list=list.filter(o=>isNum(o.imp)?o.imp>=(TDF.hi?4:3):true);
  const chip=(k,lab,v)=>'<button class="chip" data-td="flt" data-f="'+k+'"'+(v!==undefined?' data-v="'+v+'"':'')+' aria-pressed="'+(v!==undefined?TDF[k]===v:!!TDF[k])+'">'+lab+'</button>';
  h+='<section><h3>開示の一覧 <span class="small">'+list.length+'件</span></h3><div class="chips">'+chip('hi','重要度4以上')+chip('dir','プラス','良い')+chip('dir','マイナス','悪い')+chip('mine','保有・監視')+chip('star','★気になる')+chip('unread','未読だけ')+'</div>'+
    (list.length?list.slice(0,200).map(o=>tdRow(o,mine)).join(''):'<div class="empty">条件に合う開示はありません。</div>')+'</section>';
  h+='<p class="small">数字の判定（業績修正・配当・決算短信・自社株買い）はPCのPythonがXBRL（日本はTDnet、米国はSECの10-Q・10-K）から出したもの（香港はXBRLが無いのですべてClaude）、それ以外はClaudeが本文を読んで判定したもの（判定元に表示）。このアプリでは判定し直さない。</p>';
  app.innerHTML=h;
}
async function tdSetMark(k,code,patch){
  const m=tdMark(k); const nx={read:m[0],star:m[1],memo:m[2]}; Object.assign(nx,patch);
  TD.marks=TD.marks||{}; TD.marks[k]=[nx.read,nx.star,nx.memo,code||m[3]]; store.set('shk-tdnet',TD); renderTdnet(); tdCount();
  try{ const j=await api('tdnetMark',Object.assign({key:k,code:code||m[3]},nx)); if(j.marks){TD.marks=j.marks; store.set('shk-tdnet',TD);} }
  catch(e){ TDS.err='保存できませんでした：'+errText(e); renderTdnet(); }
}
app.addEventListener('click',e=>{ const b=e.target.closest('[data-td]'); if(!b||location.hash==='#settings') return; e.preventDefault();
  const a=b.dataset.td, k=b.dataset.k;
  const it=k?(TD.items||[]).map(tdItem).find(o=>tdKey(o)===k):null, code=it?it.code:'';
  if(a==='reload') readTdnet(true);
  else if(a==='mkt'){ TDF.mkt=b.dataset.m; TDF.date=''; TDF.sec=''; tdSave(); renderTdnet(); }
  else if(a==='win'){ TDF.win=+b.dataset.n; tdSave(); renderTdnet(); }
  else if(a==='sec'){ TDF.sec=TDF.sec===b.dataset.s?'':b.dataset.s; tdSave(); renderTdnet(); }
  else if(a==='flt'){ const f=b.dataset.f; if(b.dataset.v!==undefined) TDF[f]=TDF[f]===b.dataset.v?'':b.dataset.v; else TDF[f]=!TDF[f]; tdSave(); renderTdnet(); }
  else if(a==='read') tdSetMark(k,code,{read:!tdMark(k)[0]});
  else if(a==='star') tdSetMark(k,code,{star:!tdMark(k)[1]});
  else if(a==='memo'){ TDS.open[k]=!TDS.open[k]; renderTdnet(); }
  else if(a==='memosave'){ const ta=document.getElementById('tdm-'+k.replace(/[^0-9A-Za-z]/g,'')); TDS.open[k]=false; tdSetMark(k,b.dataset.code||code,{memo:ta?ta.value:''}); }
});
app.addEventListener('change',e=>{ if(e.target&&e.target.id==='tdDate'){ TDF.date=e.target.value; tdSave(); renderTdnet(); } });

// ホーム画面のアイコンにも未読数（対応端末のみ）
const _tdCount=tdCount; tdCount=function(){ _tdCount(); const el=document.getElementById('tdcount'); const n=+(el&&el.textContent)||0;
  try{ if(navigator.setAppBadge){ n?navigator.setAppBadge(n):navigator.clearAppBadge(); } }catch(e){} document.title=(n?'('+n+') ':'')+'適時開示ウォッチ'; };
const S={busy:false,msg:null};
function renderSettings(){
  setTab('settings');
  const c=cfg()||{};
  let h='<section><h3>接続設定</h3><div class="theo"><p class="small" style="margin:0">四季報ビューアと同じApps ScriptのURLと合言葉です。同じブラウザで四季報ビューアを設定済みなら、もう入っています。</p><div class="form">'+
    '<label class="wide" for="c-url">Apps Script ウェブアプリのURL（…/exec）<input id="c-url" inputmode="url" autocomplete="off" value="'+esc(c.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec"></label>'+
    '<label class="wide" for="c-token">合言葉（Code.gs の TOKEN）<input id="c-token" autocomplete="off" value="'+esc(c.token||'')+'"></label></div>'+
    '<div class="actions"><button class="btn" data-act="cfg-save"'+(S.busy?' disabled':'')+'>保存して接続を確かめる</button></div>';
  if(S.msg) h+='<div class="msg'+(S.msg.err?' err':'')+'">'+esc(S.msg.t)+'</div>';
  h+='</div></section>';
  h+='<section><h3>ホーム画面に追加</h3><div class="theo small"><span>Android：Chromeのメニュー（︙）→「ホーム画面に追加」または「アプリをインストール」。</span><span>iPhone：Safariの共有ボタン →「ホーム画面に追加」（iPhoneはアプリごとに設定が分かれるので、追加後にもう一度URLと合言葉を入れてください）。</span></div></section>';
  app.innerHTML=h;
}
app.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]'); if(!b) return;
  if(b.dataset.act==='cfg-save'){ e.preventDefault(); const url=document.getElementById('c-url').value.trim(), token=document.getElementById('c-token').value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){S.msg={t:'URLは https://script.google.com/macros/s/…/exec の形で入れてください。',err:true};renderSettings();return}
    store.set('shk-cfg',{url,token}); S.busy=true; S.msg={t:'接続を確かめています…'}; renderSettings();
    try{ await api('ping'); S.busy=false; S.msg={t:'つながりました。'}; renderSettings(); TDS.state='init'; WAT=0; readWatch(); readTdnet(true); }
    catch(err){ S.busy=false; S.msg={t:errText(err),err:true}; renderSettings(); } }
});
document.addEventListener('click',e=>{const el=e.target.closest('button,.btn,.chip,.tabs a');if(!el||el.disabled)return;
  el.classList.add('tapped');setTimeout(()=>el.classList.remove('tapped'),250);try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}},true);
function route(){ if(location.hash==='#settings'){renderSettings();return} if(!cfg()){location.hash='settings';return} renderTdnet(); readTdnet(); readWatch(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&cfg()){ readTdnet(); readWatch(); } });
window.addEventListener('hashchange',route);
tdCount(); route();
})();
